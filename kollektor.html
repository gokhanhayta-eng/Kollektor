<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kollektör Kayıt</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6fd6">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0b6fd6;--ok:#1a9c5b;--bd:#d8dee5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1c242d;--tx:#e8edf2;--mu:#93a0ad;--bd:#33404d}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1c242d;--tx:#e8edf2;--mu:#93a0ad;--bd:#33404d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
.btn{display:block;width:100%;padding:16px;margin:10px 0;border:0;border-radius:12px;background:var(--pr);color:#fff;font-size:17px;font-weight:600}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.ok{background:var(--ok)}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;margin:0;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.card.lock{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.row>*:first-child{flex:1}
label.ck{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok)}
input[type=text],input[type=tel]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin-top:6px}
img.pv{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:10px}
.t{font-weight:600}
.mu{color:var(--mu);font-size:14px}
.ab{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2430;color:#fff;padding:12px 18px;border-radius:24px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <h1>Kollektör Kayıt</h1>
  <button class="btn" onclick="newRec()">＋ Yeni kayıt</button>
  <button class="btn sec" onclick="exportJSON()">Veriyi dışa aktar</button>
  <button class="btn sec" onclick="exportXLSX()">Excel'e aktar</button>
  <p class="mu" id="count"></p>
</div>

<div id="form" class="hide">
  <div class="row"><h1>Yeni kayıt</h1><button class="btn sec sm" onclick="goHome()">Ana sayfa</button></div>

  <div class="card" id="s1">
    <div class="t">1. Resim 1 çek</div>
    <input type="file" id="f1" accept="image/*" capture="environment" class="hide" onchange="photo(1,this)">
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="f1.click()">📷 Fotoğraf çek</button>
    <label class="ck"><input type="checkbox" id="c1" disabled> Onay</label></div>
    <img id="p1" class="pv hide">
  </div>

  <div class="card lock" id="s2">
    <div class="t">2. Resim 2 çek</div>
    <input type="file" id="f2" accept="image/*" capture="environment" class="hide" onchange="photo(2,this)">
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="f2.click()">📷 Fotoğraf çek</button>
    <label class="ck"><input type="checkbox" id="c2" disabled> Onay</label></div>
    <img id="p2" class="pv hide">
  </div>

  <div class="card lock" id="s3">
    <div class="t">3. Konum bilgisi</div>
    <input type="text" id="ada" placeholder="Ada" inputmode="numeric">
    <input type="text" id="parsel" placeholder="Parsel" inputmode="numeric">
    <div class="row" style="margin-top:6px"><input type="text" id="koor" placeholder="Koordinat">
    <button class="btn sec sm" style="margin-top:6px" onclick="paste()">Yapıştır</button></div>
  </div>

  <div class="card lock" id="s4">
    <div class="row"><div class="t">4. Aboneler</div><button class="btn sm" onclick="addAb()">＋ Abone ekle</button></div>
    <div id="abs"></div>
  </div>

  <button class="btn ok" id="save" onclick="save()">Kaydet</button>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
const $=id=>document.getElementById(id);
let DB,cur;
const open=indexedDB.open("kollektor",1);
open.onupgradeneeded=e=>e.target.result.createObjectStore("rec",{keyPath:"id",autoIncrement:true});
open.onsuccess=e=>{DB=e.target.result;count()};
open.onerror=()=>toast("Depolama açılamadı");

function all(){return new Promise(r=>{if(!DB)return r([]);const q=DB.transaction("rec").objectStore("rec").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
function put(o){return new Promise((res,rej)=>{const q=DB.transaction("rec","readwrite").objectStore("rec").add(o);q.onsuccess=res;q.onerror=rej})}
async function count(){const a=await all();$("count").textContent=a.length+" kayıt kaydedildi"}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)}
function goHome(){$("form").classList.add("hide");$("home").classList.remove("hide");count()}

function newRec(){
  cur={p1:null,p2:null};
  ["ada","parsel","koor"].forEach(i=>$(i).value="");
  [1,2].forEach(n=>{$("c"+n).checked=false;$("p"+n).classList.add("hide");$("f"+n).value=""});
  ["s2","s3","s4"].forEach(i=>$(i).classList.add("lock"));
  $("abs").innerHTML="";addAb();
  $("home").classList.add("hide");$("form").classList.remove("hide");
  scrollTo(0,0);
}

function photo(n,inp){
  const f=inp.files[0];if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const m=900,s=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const d=c.toDataURL("image/jpeg",.65);URL.revokeObjectURL(u);
    cur["p"+n]=d;$("p"+n).src=d;$("p"+n).classList.remove("hide");$("c"+n).checked=true;
    if(n===1)$("s2").classList.remove("lock");
    else{$("s3").classList.remove("lock");$("s4").classList.remove("lock")}
    const nx=$(n===1?"s2":"s3");setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"start"}),150);
  };
  img.src=u;
}

async function paste(){
  try{$("koor").value=(await navigator.clipboard.readText()).trim()}
  catch(e){$("koor").focus();toast("Alana basılı tutup yapıştırın")}
}

function addAb(){
  const d=document.createElement("div");d.className="ab";
  d.innerHTML='<div class="row"><span class="mu">Abone</span><button class="btn sec sm" onclick="this.closest(\'.ab\').remove()">Sil</button></div>'+
  '<input type="text" class="ano" placeholder="Abone No" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')">';
  $("abs").appendChild(d);
}

async function save(){
  if(!cur.p1||!cur.p2)return toast("İki resmi de çekin");
  if(!$("ada").value.trim()||!$("parsel").value.trim())return toast("Ada ve parsel girin");
  const ab=[...document.querySelectorAll(".ab")].map(e=>({no:e.querySelector(".ano").value.trim()})).filter(a=>a.no);
  try{
    await put({tarih:new Date().toISOString(),ada:$("ada").value.trim(),parsel:$("parsel").value.trim(),koordinat:$("koor").value.trim(),foto1:cur.p1,foto2:cur.p2,aboneler:ab});
    toast("Kaydedildi ✓ Yeni kayıt açıldı");newRec();
  }catch(e){toast("Kayıt hatası (depolama dolu olabilir)")}
}

function saveFile(blob,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function exportJSON(){
  const a=await all();if(!a.length)return toast("Kayıt yok");
  saveFile(new Blob([JSON.stringify(a)],{type:"application/json"}),"kollektor_yedek.json");
}
async function exportXLSX(){
  const a=await all();if(!a.length)return toast("Kayıt yok");
  if(typeof XLSX==="undefined")return toast("Excel kütüphanesi yüklenemedi");
  const rows=[];
  a.forEach(r=>{
    const base={"Kayıt No":r.id,"Tarih":r.tarih.slice(0,16).replace("T"," "),"Ada":r.ada,"Parsel":r.parsel,"Koordinat":r.koordinat};
    if(!r.aboneler.length)rows.push({...base,"Abone No":""});
    r.aboneler.forEach(b=>rows.push({...base,"Abone No":b.no}));
  });
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Kayıtlar");
  XLSX.writeFile(wb,"kollektor_kayitlar.xlsx");
}
</script>
</body>
</html>
